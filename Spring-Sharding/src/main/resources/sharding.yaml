dataSources:
  mysql_ds:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:3306/test?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: anhduy12

  pg_ds:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: org.postgresql.Driver
    jdbcUrl: jdbc:postgresql://localhost:5432/postgres
    username: duytc
    password: anhduy12

rules:
  - !SHARDING
    tables:
      t_order:
        actualDataNodes: mysql_ds.t_order_$->{0..1}
        tableStrategy:
          standard:
            shardingColumn: order_id
            shardingAlgorithmName: t-order-inline
        keyGenerateStrategy:
          column: order_id
          keyGeneratorName: snowflake

      t_customer:
        actualDataNodes: pg_ds.t_customer
        tableStrategy:
          none:

    shardingAlgorithms:
      t-order-inline:
        type: INLINE
        props:
          algorithm-expression: t_order_$->{order_id % 2}

    keyGenerators:
      snowflake:
        type: SNOWFLAKE

props:
  sql-show: true